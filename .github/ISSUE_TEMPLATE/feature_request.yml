name: Feature request
description: 提议新能力或改进方案
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 请描述要解决的校园服务或工程问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、主要用例和边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 列出已考虑过的其他解决方式。
